services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: catat_denda
      POSTGRES_PASSWORD: catat_denda_dev
      POSTGRES_DB: catat_denda
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catat_denda -d catat_denda"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
