# Install inside nginx's http context. Replace domain and certificate paths.
server {
    listen 80;
    server_name catat.example.com;
    access_log off;
    if ($host != catat.example.com) { return 444; }
    return 308 https://catat.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name catat.example.com;
    ssl_certificate /etc/letsencrypt/live/catat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/catat.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host != catat.example.com) { return 444; }
    server_tokens off;
    client_max_body_size 100k;
    # Disable access logging of query strings and private export filters.
    access_log off;
    error_log /var/log/nginx/catat-error.log warn;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # Only this proxy can reach the loopback API. Never append an untrusted XFF.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_next_upstream off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /api/v1/health/ready { return 404; }
    location = /api/v1/health/ready/ { return 404; }
    location /api/v1/ {
        proxy_cache off;
        proxy_pass http://127.0.0.1:3001;
    }
    location / {
        proxy_cache off;
        proxy_pass http://127.0.0.1:3000;
    }
}
